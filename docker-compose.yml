version: '3.8'

services:
  # Node.js ve Python Bağımlı Backend Servisi
  backend:
    build: .
    container_name: nsosyal_backend
    restart: always
    ports:
      - "3006:3006"
    env_file:
      - .env
    volumes:
      - ./backend/database.db:/app/backend/database.db
      - ./frontend/reports:/app/frontend/reports

  # Nginx Ters Vekil Sunucusu ve WAF/Rate Limiting Servisi
  nginx:
    image: nginx:alpine
    container_name: nsosyal_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      # Projedeki nginx.conf dosyasını container içerisine mount ediyoruz
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
