# ============================================================
# NGINX REVERSE PROXY & WAF CONFIGURATION
# TEKNOFEST 2026 - NSosyal İnovasyon Projesi
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performans Ayarları
    sendfile        on;
    keepalive_timeout  65;

    # Güvenlik Ayarı: Nginx sürüm numarasını hata sayfalarında gizle
    server_tokens off;

    # ===== 🛡️ GÜVENLİK VE TRAFİK YÖNETİMİ (RATE LIMITING) =====
    # IP başına dakikada maksimum 20 isteğe izin ver (DDoS ve Brute Force Koruması)
    limit_req_zone $binary_remote_addr zone=anti_bruteforce:10m rate=20r/m;

    server {
        # Dış dünyadan gelen 80 (HTTP) portu isteklerini dinle
        listen       80;
        server_name  localhost;

        # ===== 🛡️ İSTEK BOYUTU SINIRI (BUFFER OVERFLOW KORUMASI) =====
        client_max_body_size 10M;

        # ===== 🛡️ GÜVENLİK BAŞLIKLARI (SECURITY HEADERS) =====
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            # Hız sınırlamasını bu konuma uygula
            # burst=50: anlık yoğunlaşmalarda 50 isteğe kadar tolerans göster, nodelay: gecikmesiz işle
            limit_req zone=anti_bruteforce burst=50 nodelay;

            # ===== 🔄 YÖNLENDİRME (PROXY PASS) =====
            # Port 80 üzerinden gelen istekleri arka planda çalışan Node.js sunucusuna aktar
            proxy_pass http://127.0.0.1:3006;

            # ===== 👤 GERÇEK IP VE HOST AKTARIMI =====
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Bağlantı Desteği
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
