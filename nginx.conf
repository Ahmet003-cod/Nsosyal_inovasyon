# ============================================================
# NGINX REVERSE PROXY & WAF CONFIGURATION
# TEKNOFEST 2026 - NSosyal İnovasyon Projesi
# ============================================================

# Sunucunun kaç çekirdek (worker) ile çalışacağını belirler. 'auto' CPU çekirdek sayısına göre otomatik ayarlar.
worker_processes auto;

events {
    # Bir worker'ın eşzamanlı olarak kabul edebileceği maksimum bağlantı sayısı.
    worker_connections 1024;
}

http {
    # Nginx'in desteklediği MIME (dosya türleri) eşlemelerini dahil eder (CSS, JS, resim vs. doğru yüklensin diye).
    include       mime.types;
    # Eğer dosya türü anlaşılamazsa varsayılan olarak ikili (binary) akış kabul et.
    default_type  application/octet-stream;

    # Performans Ayarları
    # sendfile, dosyaları işletim sistemi çekirdeği üzerinden direkt göndererek I/O performansını artırır.
    sendfile        on;
    # İstemci (client) ile bağlantının ne kadar süre açık tutulacağını saniye cinsinden belirler.
    keepalive_timeout  65;

    # Güvenlik Ayarı: Nginx sürüm numarasını hata sayfalarında gizle (Bilgi sızıntısını engeller)
    server_tokens off;

    # ===== 🛡️ GÜVENLİK VE TRAFİK YÖNETİMİ (RATE LIMITING) =====
    # IP başına dakikada maksimum 20 isteğe izin ver (DDoS ve Brute Force Koruması için WAF kuralı)
    # limit_req_zone komutu ile "anti_bruteforce" adında 10 megabaytlık bir hafıza alanı ayrılır.
    limit_req_zone $binary_remote_addr zone=anti_bruteforce:10m rate=20r/m;

    server {
        # Dış dünyadan gelen HTTP (80) portu isteklerini dinle.
        listen       80;
        server_name  localhost;

        # ===== 🛡️ İSTEK BOYUTU SINIRI (BUFFER OVERFLOW KORUMASI) =====
        # Kullanıcıların sunucuya gönderebileceği maksimum dosya/istek boyutunu 10MB olarak sınırlar.
        client_max_body_size 10M;

        # ===== 🛡️ GÜVENLİK BAŞLIKLARI (SECURITY HEADERS) =====
        # X-Frame-Options: Clickjacking saldırılarını önler. Siteyi sadece kendi domaini içinden iframe olarak yüklenebilir yapar.
        add_header X-Frame-Options "SAMEORIGIN" always;
        # X-XSS-Protection: Tarayıcıların dahili Cross-Site Scripting (XSS) korumasını aktif eder.
        add_header X-XSS-Protection "1; mode=block" always;
        # X-Content-Type-Options: MIME-sniffing saldırılarını engeller. Tarayıcının dosya türünü zorla değiştirmesini engeller.
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            # Hız sınırlamasını (Rate Limiting) bu konuma uygula
            # burst=50: anlık yoğunlaşmalarda 50 isteğe kadar tolerans göster, nodelay: bekleme süresi olmadan gecikmesiz işle
            limit_req zone=anti_bruteforce burst=50 nodelay;

            # ===== 🔄 YÖNLENDİRME (PROXY PASS) =====
            # Port 80 üzerinden gelen dış istekleri (Frontend/İstemci), arka planda çalışan Node.js (Backend) sunucusuna aktar.
            proxy_pass http://127.0.0.1:3006;

            # ===== 👤 GERÇEK IP VE HOST AKTARIMI =====
            # Nginx aracı kurum olduğu için, arka plandaki Node.js sunucusuna kullanıcının gerçek IP'sini ve bağlantı bilgilerini aktarır.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Bağlantı Desteği: Canlı bildirimler, chat veya MCP servisleri için Socket desteği ekler.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
